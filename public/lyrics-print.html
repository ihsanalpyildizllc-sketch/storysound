<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyric Sheet — StorySound</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#221D17;--soft:#6E645A;--faint:#A99F93;--rust:#B5471C;--paper:#FDFCF9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EDE9E2;font-family:'Inter',sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid rgba(0,0,0,.07);padding:12px 16px;display:flex;gap:10px;justify-content:center;z-index:5}
.bar button,.bar a{border:none;cursor:pointer;border-radius:10px;padding:11px 20px;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;text-decoration:none}
.bar .p{background:var(--rust);color:#fff}.bar .g{background:#fff;color:var(--rust);border:1.5px solid var(--rust)}
.sheet{background:var(--paper);max-width:640px;margin:26px auto;padding:64px 56px 48px;box-shadow:0 20px 60px rgba(30,24,18,.18);position:relative}
.sheet::before{content:"";position:absolute;inset:14px;border:1px solid rgba(181,71,28,.25);pointer-events:none}
.eyebrow{text-align:center;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint);margin-bottom:18px}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,5.5vw,40px);text-align:center;line-height:1.15;letter-spacing:-.01em}
.for{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;text-align:center;color:var(--soft);font-size:16px;margin:10px 0 8px}
.rule{width:64px;height:1.5px;background:var(--rust);margin:22px auto 30px;opacity:.7}
.lyr{font-family:'Playfair Display',serif;font-weight:500;font-size:15.5px;line-height:2.05;text-align:center;white-space:pre-line;color:#2B241D}
.sect{display:block;font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);margin:26px 0 6px}
.foot{margin-top:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid rgba(0,0,0,.08);padding-top:22px}
.brand{font-size:11px;color:var(--faint);line-height:1.7}
.brand b{color:var(--soft);letter-spacing:.06em}
.qr{width:76px;height:76px;flex:none}
.qr img{width:100%;height:100%;display:block}
.qrcap{font-size:9px;color:var(--faint);text-align:center;margin-top:4px;letter-spacing:.06em}
.load{text-align:center;padding:80px 20px;color:var(--soft)}
@media print{
 body{background:#fff}.bar{display:none}
 .sheet{box-shadow:none;margin:0;max-width:none;min-height:100vh;padding:14mm 16mm}
 @page{margin:0;size:auto}
}
</style></head><body>
<div class="bar">
 <button class="p" onclick="window.print()">🖨 Print / Save as PDF</button>
 <a class="g" id="back">← Back to your song</a>
</div>
<div id="app"><div class="load">Preparing your lyric sheet…</div></div>
<script>
(function(){
var o=new URLSearchParams(location.search).get("o")||"";
document.getElementById("back").href="/delivery?o="+encodeURIComponent(o);
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
fetch("/.netlify/functions/delivery-data?o="+encodeURIComponent(o)).then(function(r){return r.json();}).then(function(d){
 if(d.redirect){location.href=d.redirect;return;}
 if(!d.ready){document.getElementById("app").innerHTML='<div class="load">Your song is still finishing — try again in a minute.</div>';return;}
 if(!d.lyricsBought){location.href="/delivery?o="+encodeURIComponent(o);return;}
 // rebuild section labels from the raw feel of the lines: server strips [markers], so present as verses split on gaps is lost — render lines with elegant spacing
 var songUrl=location.origin+"/delivery?o="+encodeURIComponent(o);
 var qr="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&color=6E645A&data="+encodeURIComponent(songUrl);
 document.getElementById("app").innerHTML=
  '<div class="sheet">'+
   '<div class="eyebrow">A song written for</div>'+
   '<h1>\u201c'+esc(d.title)+'\u201d</h1>'+
   (d.name?'<div class="for">for '+esc(d.name)+(d.relationship?' \u00b7 '+esc(d.relationship):'')+'</div>':'')+
   '<div class="rule"></div>'+
   '<div class="lyr">'+esc(d.lyrics.join("\n"))+'</div>'+
   '<div class="foot">'+
    '<div class="brand"><b>STORYSOUND</b><br>A one-of-one song \u00b7 '+new Date().getFullYear()+'</div>'+
    '<div><div class="qr"><img src="'+qr+'" alt="Scan to listen"></div><div class="qrcap">SCAN TO LISTEN</div></div>'+
   '</div>'+
  '</div>';
 document.title='\u201c'+d.title+'\u201d \u2014 Lyric Sheet';
}).catch(function(){document.getElementById("app").innerHTML='<div class="load">Couldn\u2019t load — refresh to retry.</div>';});
})();
</script></body></html>
