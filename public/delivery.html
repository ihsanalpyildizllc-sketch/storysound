<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your song — StorySound</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--bg2:#F3F1EC;--ink:#1A1814;--mut:#5C564D;--fade:#9A9389;--rust:#C8553D;--rustD:#9E3E2C;
--bd:rgba(26,24,20,.08);--sh:0 10px 25px -5px rgba(26,24,20,.08),0 8px 10px -6px rgba(26,24,20,.04);--font:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;font-size:16px}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
header{padding:20px 0;text-align:center;border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:20px;letter-spacing:-.04em}.logo span{color:var(--rust)}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:26px 22px;box-shadow:var(--sh);margin:20px 0}
h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.03em;line-height:1.15;text-align:center;margin:28px 0 6px}
.sub{text-align:center;color:var(--mut);margin-bottom:8px}
.play{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--rust),var(--rustD));
color:#fff;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 8px 24px -4px rgba(200,85,61,.35);transition:transform .2s}
.play:hover{transform:scale(1.05)}.play svg{width:26px;height:26px;margin-left:3px}
.bar{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rust),#E08A6F);border-radius:5px}
.tl{display:flex;justify-content:space-between;font-size:12px;color:var(--fade);margin-top:6px;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;text-align:center;border:none;cursor:pointer;border-radius:13px;padding:17px;
background:linear-gradient(135deg,var(--rust),var(--rustD));color:#fff;font-family:var(--font);font-size:17px;font-weight:700;text-decoration:none;
box-shadow:0 8px 24px -4px rgba(200,85,61,.32);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--rust);border:2px solid var(--rust);box-shadow:none}
.cap{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--fade);margin-bottom:14px;text-align:center}
.lyr{font-size:17px;line-height:1.9;text-align:center;white-space:pre-line}
.bl{height:15px;margin:12px auto;border-radius:4px;background:linear-gradient(90deg,#E8E4DD,#F3F1EC);filter:blur(3px)}
.blurbox{position:relative;margin-top:10px;padding-top:6px}
.veil{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(180deg,transparent,#fff 75%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;pointer-events:none}
.veil b{font-size:15px}
.share{display:flex;gap:10px}.share a{flex:1;text-align:center;padding:13px;border:1.5px solid var(--bd);border-radius:11px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;background:#fff}
.up{background:linear-gradient(160deg,#22110B,#3A1C10);color:#fff;border-radius:18px;padding:26px 22px;margin:20px 0}
.up h3{font-size:22px;letter-spacing:-.02em;margin-bottom:8px}
.up p{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:16px}
.up .btn{background:#fff;color:var(--rustD);box-shadow:none}
footer{padding:34px 20px;text-align:center;color:var(--fade);font-size:12px}
.spin{width:44px;height:44px;border:4px solid var(--bg2);border-top-color:var(--rust);border-radius:50%;margin:60px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{header,.btn,.share,.up,footer,.playcard{display:none!important}.card{box-shadow:none;border:none}}
</style></head><body>
<header><div class="logo">Story<span>Sound</span></div></header>
<div class="wrap" id="app"><div class="spin"></div></div>
<footer>© <span id="yr"></span> StorySound · <a href="/terms" style="color:inherit">Terms</a> · <a href="/refunds" style="color:inherit">Refunds</a></footer>
<script>
(function(){
"use strict";
var q=new URLSearchParams(location.search), o=q.get("o"), app=document.getElementById("app");
document.getElementById("yr").textContent=new Date().getFullYear();
if(!o){app.innerHTML='<p style="text-align:center;padding:60px 0;color:var(--mut)">Missing order link. Check your email for the correct one.</p>';return;}
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};

function load(){
 fetch("/.netlify/functions/delivery-data?o="+encodeURIComponent(o)).then(function(r){return r.json();}).then(function(d){
  if(d.redirect){location.href=d.redirect;return;}
  if(d.error){app.innerHTML='<p style="text-align:center;padding:60px 0;color:var(--mut)">We couldn\u2019t find that order. Reply to your email and we\u2019ll sort it.</p>';return;}
  if(!d.ready){app.innerHTML='<h1>Finishing your song\u2026</h1><p class="sub">'+(d.stage==="writing"?"Writing the lyrics":"Composing the melody")+' \u2014 this page refreshes itself.</p><div class="spin"></div>';setTimeout(load,4000);return;}
  render(d);
 }).catch(function(){setTimeout(load,5000);});
}

function render(d){
 var lyricsBlock = d.lyricsBought
  ? '<div class="card"><div class="cap">\ud83d\udcdc Your lyrics</div><div class="lyr">'+esc(d.lyrics.join("\n"))+'</div>'+
    '<button class="btn ghost" style="margin-top:18px" onclick="window.print()">\ud83d\udda8 Print my lyrics</button></div>'
  : '<div class="card"><div class="cap">\ud83d\udcdc From your lyrics</div><div class="lyr">'+esc(d.lyrics.join("\n"))+'</div>'+
    '<div class="blurbox">'+
     '<div class="bl" style="width:86%"></div><div class="bl" style="width:74%"></div><div class="bl" style="width:90%"></div><div class="bl" style="width:68%"></div><div class="bl" style="width:82%"></div>'+
     '<div class="veil"><b>\ud83d\udd12 +'+Math.max(0,d.lyricsTotal-3)+' more lines</b></div>'+
    '</div>'+
    '<a class="btn" style="margin-top:16px" href="https://gut-1809.myshopify.com/cart/44263011287129:1?attributes[Original_Order]='+encodeURIComponent(d.orderId)+'&attributes[Lyrics_Addon]=Yes">Get the printable lyrics \u2014 $19</a></div>';

 app.innerHTML =
  '<h1>\u201c'+esc(d.title)+'\u201d</h1><p class="sub">Yours forever. Download it, share it, play it loud.</p>'+
  '<div class="card playcard"><button class="play" id="pl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>'+
  '<div class="bar" id="bar"><i id="fill"></i></div><div class="tl"><span id="cur">0:00</span><span id="dur">\u2013:\u2013\u2013</span></div></div>'+
  '<a class="btn" href="'+d.downloadUrl+'" download>\u2b07 Download MP3 \u2014 yours forever</a>'+
  '<div class="share" style="margin-top:12px">'+
   '<a href="https://wa.me/?text='+encodeURIComponent('\ud83c\udfb5 Listen to this: '+location.origin+'/delivery?o='+d.orderId)+'" target="_blank" rel="noopener">WhatsApp</a>'+
   '<a href="#" id="cp">Copy link</a></div>'+
  lyricsBlock+
  '<div class="card" id="revCard">'+
  '<div class="cap">🔁 Want something changed?</div>'+
  '<p style="font-size:14px;color:var(--mut);text-align:center;margin-bottom:14px">Revisions are free until you love it. Tell us what to adjust and a new version lands in your inbox.</p>'+
  '<button class="btn ghost" id="revOpen">Request a free revision</button>'+
  '<div id="revForm" style="display:none;margin-top:16px">'+
   '<label style="font-weight:700;font-size:14px;display:block;margin-bottom:6px">What should change?</label>'+
   '<textarea id="revText" style="width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:12px;font-family:var(--font);font-size:14px;min-height:100px" placeholder="e.g. Less repetition in the chorus, focus more on the trip to the cabin, slower tempo…"></textarea>'+
   '<label style="font-weight:700;font-size:14px;display:block;margin:12px 0 6px">Anything to keep exactly as-is? <span style="font-weight:400;color:var(--fade)">(optional)</span></label>'+
   '<input id="revKeep" style="width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:12px;font-family:var(--font);font-size:14px" placeholder="e.g. The opening verse — that one is perfect">'+
   '<button class="btn" id="revSend" style="margin-top:14px">Send revision request</button>'+
   '<p id="revMsg" style="text-align:center;font-size:13px;margin-top:10px;min-height:18px"></p>'+
  '</div></div>'+

  '<div class="up"><h3>🎬 Turn it into a video</h3><p>Your photos, set to '+esc(d.title)+' — lyrics on screen, ready for the party TV and the family group chat. This is the version everyone shares.</p>'+
  '<a class="btn" href="/memory-video?o='+encodeURIComponent(d.orderId)+'">Make the Memory Video — $39</a></div>'+

  '<div class="up" style="background:linear-gradient(160deg,#1F3D2E,#16301F)"><h3>Who else deserves one?</h3><p>A birthday is coming. You already know whose. Make the gift nobody else will think of — in the next five minutes.</p>'+
  '<a class="btn" style="color:#16301F" href="/create">🎵 Make another song — $39</a></div>';

 var a=new Audio(d.audioUrl),pl=document.getElementById("pl"),fill=document.getElementById("fill"),
     cur=document.getElementById("cur"),dur=document.getElementById("dur"),playing=false;
 var fmt=function(s){if(!isFinite(s)||isNaN(s)||s<0)return "\u2013:\u2013\u2013";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
 var setDur=function(){if(isFinite(a.duration)&&a.duration>0)dur.textContent=fmt(a.duration);};
 a.addEventListener("loadedmetadata",setDur);
 a.addEventListener("durationchange",setDur);
 a.addEventListener("timeupdate",function(){cur.textContent=fmt(a.currentTime);setDur();if(isFinite(a.duration)&&a.duration>0)fill.style.width=(a.currentTime/a.duration*100)+"%";});
 a.addEventListener("ended",function(){playing=false;pl.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';});
 pl.addEventListener("click",function(){playing=!playing;
  pl.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  playing?a.play():a.pause();});
 document.getElementById("bar").addEventListener("click",function(e){
  var r=this.getBoundingClientRect();if(a.duration)a.currentTime=(e.clientX-r.left)/r.width*a.duration;});
 document.getElementById("cp").addEventListener("click",function(e){e.preventDefault();
  navigator.clipboard.writeText(location.origin+"/delivery?o="+d.orderId).then(function(){e.target.textContent="Copied \u2713";});});
 document.getElementById("revOpen").addEventListener("click",function(){
  this.style.display="none";document.getElementById("revForm").style.display="block";});
 document.getElementById("revSend").addEventListener("click",function(){
  var t=document.getElementById("revText").value.trim(),msg=document.getElementById("revMsg");
  if(t.length<10){msg.textContent="A sentence or two helps — what should be different?";msg.style.color="var(--rust)";return;}
  var btn=this;btn.disabled=true;btn.textContent="Sending…";
  fetch("/.netlify/functions/revision-request",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({o:d.orderId,feedback:t,keep:document.getElementById("revKeep").value.trim()})})
  .then(function(r){return r.json();}).then(function(x){
   if(x.ok){document.getElementById("revForm").innerHTML='<p style="text-align:center;font-weight:700;padding:10px">✅ Got it — check your email. New version usually within a few hours.</p>';}
   else{msg.textContent=x.error||"Couldn\u2019t send — try again";msg.style.color="var(--rust)";btn.disabled=false;btn.textContent="Send revision request";}
  }).catch(function(){msg.textContent="Couldn\u2019t send — try again";btn.disabled=false;btn.textContent="Send revision request";});
 });
}
load();
})();
</script></body></html>
