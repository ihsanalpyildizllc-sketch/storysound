<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your song — Stoory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--bg2:#F3F1EC;--ink:#1A1814;--mut:#5C564D;--fade:#9A9389;--rust:#C8553D;--rustD:#9E3E2C;
--bd:rgba(26,24,20,.08);--sh:0 10px 25px -5px rgba(26,24,20,.08),0 8px 10px -6px rgba(26,24,20,.04);--font:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;font-size:16px}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
header{padding:20px 0;text-align:center;border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:20px;letter-spacing:-.04em}.logo em{color:var(--rust);font-style:normal}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:26px 22px;box-shadow:var(--sh);margin:20px 0}
h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.03em;line-height:1.15;text-align:center;margin:28px 0 6px}
.sub{text-align:center;color:var(--mut);margin-bottom:8px}
.play{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--rust),var(--rustD));
color:#fff;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 8px 24px -4px rgba(200,85,61,.35);transition:transform .2s}
.play:hover{transform:scale(1.05)}.play svg{width:26px;height:26px;margin-left:3px}
.bar{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rust),#E08A6F);border-radius:5px}
.tl{display:flex;justify-content:space-between;font-size:12px;color:var(--fade);margin-top:6px;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;text-align:center;border:none;cursor:pointer;border-radius:13px;padding:17px;
background:linear-gradient(135deg,var(--rust),var(--rustD));color:#fff;font-family:var(--font);font-size:17px;font-weight:700;text-decoration:none;
box-shadow:0 8px 24px -4px rgba(200,85,61,.32);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--rust);border:2px solid var(--rust);box-shadow:none}
.cap{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--fade);margin-bottom:14px;text-align:center}
.lyr{font-size:17px;line-height:1.9;text-align:center;white-space:pre-line}
.bl{height:15px;margin:12px auto;border-radius:4px;background:linear-gradient(90deg,#E8E4DD,#F3F1EC);filter:blur(3px)}
.blurbox{position:relative;margin-top:10px;padding-top:6px}
.veil{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(180deg,transparent,#fff 75%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;pointer-events:none}
.veil b{font-size:15px}
.share{display:flex;gap:10px}.share a{flex:1;text-align:center;padding:13px;border:1.5px solid var(--bd);border-radius:11px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;background:#fff}
.up{background:linear-gradient(160deg,#22110B,#3A1C10);color:#fff;border-radius:18px;padding:26px 22px;margin:20px 0}
.up h3{font-size:22px;letter-spacing:-.02em;margin-bottom:8px}
.up p{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:16px}
.up .btn{background:#fff;color:var(--rustD);box-shadow:none}
footer{padding:34px 20px;text-align:center;color:var(--fade);font-size:12px}
.spin{width:44px;height:44px;border:4px solid var(--bg2);border-top-color:var(--rust);border-radius:50%;margin:60px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{header,.btn,.share,.up,footer,.playcard{display:none!important}.card{box-shadow:none;border:none}}
</style></head><body>
<header><div class="logo">St<em>oo</em>ry</div></header>
<div class="wrap" id="app"><div class="spin"></div></div>
<footer>© <span id="yr"></span> Stoory · <a href="/terms" style="color:inherit">Terms</a> · <a href="/refund" style="color:inherit">Refunds</a></footer>
<script>
(function(){
"use strict";
var q=new URLSearchParams(location.search),o=q.get("o"),app=document.getElementById("app");
document.getElementById("yr").textContent=new Date().getFullYear();
if(!o){app.innerHTML='<p style="text-align:center;padding:60px 0;color:var(--mut)">Missing order link. Check your email for the correct one.</p>';return;}
var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var fmt=function(s){if(!isFinite(s)||isNaN(s)||s<0)return "\u2013:\u2013\u2013";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function attachPlayer(src){
 var a=new Audio(src),pl=document.getElementById("pl"),fill=document.getElementById("fill"),
     cur=document.getElementById("cur"),dur=document.getElementById("dur"),playing=false;
 var sd=function(){if(isFinite(a.duration)&&a.duration>0)dur.textContent=fmt(a.duration);};
 a.addEventListener("loadedmetadata",sd);a.addEventListener("durationchange",sd);
 a.addEventListener("timeupdate",function(){cur.textContent=fmt(a.currentTime);sd();
  if(isFinite(a.duration)&&a.duration>0)fill.style.width=(a.currentTime/a.duration*100)+"%";});
 a.addEventListener("ended",function(){playing=false;pl.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';});
 pl.addEventListener("click",function(){playing=!playing;
  pl.innerHTML=playing?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  playing?a.play():a.pause();});
 document.getElementById("bar").addEventListener("click",function(e){
  var r=this.getBoundingClientRect();if(a.duration)a.currentTime=(e.clientX-r.left)/r.width*a.duration;});
}
function load(){
 fetch("/.netlify/functions/delivery-data?o="+encodeURIComponent(o)).then(function(r){return r.json();}).then(function(d){
  if(d.redirect){location.href=d.redirect;return;}
  if(d.error){app.innerHTML='<p style="text-align:center;padding:60px 0;color:var(--mut)">Order not found. Reply to your email and we\'ll sort it.</p>';return;}
  if(!d.ready){app.innerHTML='<h1>Finishing your song&#8230;</h1><p class="sub">'+(d.stage==="writing"?"Writing the lyrics":"Composing the melody")+' &#8212; this page refreshes itself.</p><div class="spin"></div>';setTimeout(load,4000);return;}
  render(d);
 }).catch(function(){setTimeout(load,5000);});
}

function render(d){
 var Q='attributes[Original_Order]='+encodeURIComponent(d.orderId)+'&return_to=/checkout';
 var DL_URL='https://gut-1809.myshopify.com/cart/44339845791833:1?'+Q;
 var V3_URL='https://gut-1809.myshopify.com/cart/44263046381657:1?'+Q;
 var lb=d.lyricsBought
  ?'<div class="card"><div class="cap">&#128220; Your lyrics</div><div class="lyr">'+esc(d.lyrics.join("\n"))+'</div><a class="btn ghost" style="margin-top:18px" href="/lyrics-print?o='+encodeURIComponent(d.orderId)+'">Open printable lyric sheet</a></div>'
  :'<div class="card"><div class="cap">&#128220; From your lyrics</div><div class="lyr">'+esc(d.lyrics.join("\n"))+'</div><div class="blurbox"><div class="bl" style="width:86%"></div><div class="bl" style="width:74%"></div><div class="bl" style="width:90%"></div><div class="bl" style="width:68%"></div><div class="bl" style="width:82%"></div><div class="veil"><b>&#128274; +'+Math.max(0,d.lyricsTotal-3)+' more lines</b></div></div><a class="btn" style="margin-top:16px" href="https://gut-1809.myshopify.com/cart/44263011287129:1?attributes[Original_Order]='+encodeURIComponent(d.orderId)+'&attributes[Lyrics_Addon]=Yes">Get the printable lyrics &#8212; $19</a></div>';
 app.innerHTML=
  '<h1>&#8220;'+esc(d.title)+'&#8221;</h1><p class="sub">'+(d.downloadBought?'Yours forever. Download it, share it, play it loud.':'Your song is ready. Play it as many times as you like.')+'</p>'+
  '<div class="cap" style="margin-top:4px">&#127911; Listen Online</div>'+
  '<div class="card playcard"><button class="play" id="pl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><div class="bar" id="bar"><i id="fill"></i></div><div class="tl"><span id="cur">0:00</span><span id="dur">&#8211;:&#8211;&#8211;</span></div></div>'+
  (d.downloadBought
   ? '<a class="btn" href="'+d.downloadUrl+'" download>&#11015; Download MP3 &#8212; yours forever</a>'+
     '<div class="share" style="margin-top:12px"><a href="https://wa.me/?text='+encodeURIComponent('\uD83C\uDFB5 Listen to this: '+location.origin+'/delivery?o='+d.orderId)+'" target="_blank" rel="noopener">WhatsApp</a><a href="#" id="cp">Copy link</a></div>'
   : '<div class="card" style="border:1.5px solid var(--rust);background:rgba(200,85,61,.03)">'+
      '<div class="cap" style="color:var(--rust)">&#128274; Download &amp; Share</div>'+
      '<p style="font-size:14px;color:var(--mut);text-align:center;margin-bottom:14px">Your song streams here anytime. Unlock to keep the MP3 on your phone, play it with no internet, and share it as a file.</p>'+
      '<a class="btn" href="'+DL_URL+'">&#11015; Unlock Download &amp; Share &#8212; $39</a>'+
      '<p style="text-align:center;font-size:12px;color:var(--fade);margin-top:10px">One-time &middot; yours forever</p>'+
     '</div>'
  )+
  lb+
  '<div class="card" id="revCard"><div class="cap">&#128260; Want something changed?</div><p style="font-size:14px;color:var(--mut);text-align:center;margin-bottom:18px">Revisions are free until you love it. Tell us what to adjust and a new version lands in your inbox.</p><a id="revBtn" href="#" class="btn" style="display:block;text-align:center;text-decoration:none">&#128260; Request a Revision</a><p style="font-size:12px;color:var(--fade);text-align:center;margin-top:10px">Takes 30 seconds. Usually delivered within a few hours.</p></div>'+
  (d.grief ? '' :
   '<div class="up" style="position:relative;overflow:hidden">'+
   '<div style="position:absolute;top:12px;right:14px;background:#E5A400;color:#1A1814;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px">50% OFF</div>'+
   '<h3>&#127916; Gift a video full of your memories</h3>'+
   '<p style="font-size:13px;opacity:.85;margin:8px 0 4px">The slideshow that only you and '+esc(d.name||'them')+' will understand.</p>'+
   '<p>Your photos, set to \u201c'+esc(d.title)+'\u201d \u2014 ready for the party TV, the family group chat, or a quiet moment together.</p>'+
   '<div style="display:flex;align-items:baseline;gap:10px;margin:14px 0 10px">'+
    '<span style="font-size:28px;font-weight:800">$19</span>'+
    '<span style="font-size:14px;opacity:.6;text-decoration:line-through">$39</span>'+
   '</div>'+
   '<a class="btn" href="https://gut-1809.myshopify.com/cart/44344385732697:1?attributes[Original_Order]='+encodeURIComponent(d.orderId)+'&return_to=/checkout">&#127916; Get the Memory Video &#8212; $19</a>'+
  '</div>')+
  (d.grief||d.verse3Bought ? '' :
   '<div class="card" style="border:1.5px dashed var(--rust);margin-top:12px">'+
    '<div class="cap" style="color:var(--rust)">&#127925; Add a 3rd Verse</div>'+
    '<p style="font-size:14px;color:var(--mut);text-align:center;margin-bottom:14px">Two verses tell the story. A third one finishes it &#8212; more of your memories, more of them, a fuller song.</p>'+
    '<a class="btn ghost" href="'+V3_URL+'">Add a 3rd Verse &#8212; $39.20</a></div>')+
  (d.grief ? '' :
   '<div class="up" style="background:linear-gradient(160deg,#1F3D2E,#16301F)">'+
    '<h3>Who else deserves one?</h3>'+
    '<p>Make the gift nobody else will think of.</p>'+
    '<a class="btn" style="color:#16301F" href="/create">&#127925; Make another song &#8212; $39</a>'+
   '</div>');
 attachPlayer(d.audioUrl);
 var cpEl=document.getElementById("cp");
 if(cpEl) cpEl.addEventListener("click",function(e){e.preventDefault();navigator.clipboard.writeText(location.origin+"/delivery?o="+d.orderId).then(function(){e.target.textContent="Copied";});});
 function ping(k){try{navigator.sendBeacon("/.netlify/functions/track",new Blob([JSON.stringify({event:k+"_upsell_click",offer:"delivery",o:d.orderId,ts:Date.now()})],{type:"application/json"}));}catch(e){}}
 var lyrA=document.querySelector('a[href*="44263011287129"]');if(lyrA)lyrA.addEventListener("click",function(){ping("lyrics");});
 var vidA=document.querySelector('a[href*="44344385732697"]');if(vidA)vidA.addEventListener("click",function(){ping("video");});
 var newA=document.querySelector('a[href="/create"]');if(newA)newA.addEventListener("click",function(){ping("another_song");});
 var dlA=document.querySelector('a[href*="44339845791833"]');if(dlA)dlA.addEventListener("click",function(){ping("download_upsell");});
 var v3A=document.querySelector('a[href*="44263046381657"]');if(v3A)v3A.addEventListener("click",function(){ping("verse3");});
 // revision button — links to Shopify contact page pre-filled
 var revBtn = document.getElementById("revBtn");
 if(revBtn){
   var params = new URLSearchParams({ reason:"Revision Request", order:d.orderId||"", title:d.title||"", email:d.email||"" });
   revBtn.href = "https://gut-1809.myshopify.com/pages/contact?" + params.toString();
   revBtn.onclick = function(){ ping("revision"); };
 }
}
load();
})();
</script></body></html>
